name: LinkCompass
options:
  bundleIdPrefix: com.reidchatham
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
targets:
  LinkCompassCore:
    type: framework
    platform: macOS
    sources:
      - Sources/LinkCompassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompassCore
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LinkCompass:
    type: application
    platform: macOS
    sources:
      - Sources/LinkCompass
    dependencies:
      - target: LinkCompassCore
        embed: true
      - target: LinkCompassShare
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Sources/LinkCompass/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompass
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  LinkCompassShare:
    type: app-extension
    platform: macOS
    sources:
      - Sources/LinkCompassShare
      - Sources/LinkCompass/BrowserDetector.swift
    dependencies:
      - target: LinkCompassCore
        embed: false
    settings:
      base:
        INFOPLIST_FILE: Sources/LinkCompassShare/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompass.Share
        CODE_SIGN_ENTITLEMENTS: Sources/LinkCompassShare/LinkCompassShare.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
  LinkCompassNativeHost:
    type: tool
    platform: macOS
    sources:
      - Sources/LinkCompassNativeHost
    dependencies:
      - target: LinkCompassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompassNativeHost
        GENERATE_INFOPLIST_FILE: YES
  LinkCompassCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LinkCompassCoreTests
    dependencies:
      - target: LinkCompassCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompassCoreTests
        GENERATE_INFOPLIST_FILE: YES
  LinkCompassUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/LinkCompassUITests
    dependencies:
      - target: LinkCompass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reidchatham.LinkCompassUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LinkCompass:
    build:
      targets:
        LinkCompass: all
        LinkCompassNativeHost: all
        LinkCompassCoreTests: [test]
    test:
      targets:
        - LinkCompassCoreTests
      gatherCoverageData: false
  LinkCompassShare:
    build:
      targets:
        LinkCompass: all
        LinkCompassShare: all
  LinkCompassUITests:
    build:
      targets:
        LinkCompass: all
        LinkCompassUITests: [test]
    test:
      targets:
        - LinkCompassUITests
      gatherCoverageData: false
